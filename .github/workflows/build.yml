name: Build DARK PROXY IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create iOS project
        run: npx cap add ios

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Install iOS dependencies
        run: |
          cd ios/App
          pod install
          cd ../..

      - name: Build iOS app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios-build/Build/Products/Release-iphoneos/App.app Payload/
          /usr/bin/zip -r DARK-PROXY.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DARK-PROXY-IPA
          path: DARK-PROXY.ipa
